<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: #4CAF50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        @media (max-width: 760px) {
            .box {
                background-color: #f44336;
            }
        }
        @media (max-width:480) {
            .box {
                background-color: #2196F3;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="box">box</div>
</body>
</html>
